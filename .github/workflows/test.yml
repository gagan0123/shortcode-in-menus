name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    continue-on-error: ${{ matrix.wp == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        wp: ['latest']
        include:
          - php: '7.4'
            wp: '6.3'
          - php: '8.0'
            wp: '6.4'
          - php: '8.1'
            wp: '6.5'
          - php: '8.3'
            wp: 'nightly'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }} true

      - name: Debug environment
        if: ${{ matrix.php >= '8.1' }}
        run: |
          echo "=== PHP version ==="
          php -v
          echo "=== PHPUnit version ==="
          vendor/bin/phpunit --version
          echo "=== Composer packages ==="
          composer show phpunit/phpunit | head -3
          composer show yoast/phpunit-polyfills | head -3
          echo "=== WP test dir ==="
          ls /tmp/wordpress-tests-lib/includes/ | head -10
          echo "=== Polyfills class check ==="
          php -r "require 'vendor/autoload.php'; echo class_exists('Yoast\PHPUnitPolyfills\Autoload') ? 'Polyfills: OK' : 'Polyfills: MISSING'; echo PHP_EOL;"
          echo "=== Dry run PHPUnit ==="
          vendor/bin/phpunit --list-tests 2>&1 | head -20 || true

      - name: Run PHPUnit
        run: vendor/bin/phpunit --verbose 2>&1; EXIT=$?; echo "Exit code: $EXIT"; exit $EXIT

      - name: Run PHPUnit (multisite)
        run: WP_MULTISITE=1 vendor/bin/phpunit
